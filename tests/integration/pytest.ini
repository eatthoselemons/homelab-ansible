[pytest]
# Pytest configuration for integration tests

# Test markers for categorization
markers =
    critical: Critical infrastructure tests that must pass
    network: Network connectivity and configuration tests
    security: Security validation tests
    performance: Performance and optimization tests
    storage: Storage and filesystem tests
    services: Service availability tests
    slow: Tests that take longer to execute
    flaky: Tests that might fail intermittently
    destructive: Tests that modify system state
    
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    
# Timeout for tests (in seconds)
timeout = 300

# Minimum Python version
minversion = 3.6